        @tailwind base;
        @tailwind components;

        :root {

          --beige: #F5F1EB;

        @page {
          size: letter;
          margin: 72px 68px 78px 68px;
        }

        @media print {
          body { background: white !important; }
          .no-print { display: none !important; }
          .report-shell { box-shadow: none !important; margin: 0 !important; }

          .screen-header { display: none !important; }
        }

          .print-header, .print-footer { display: none; }
        }

        .report-shell {
          background: var(--paper);
          color: var(--ink);
          box-shadow: 0 1px 0 0 var(--rule), 0 8px 40px rgba(0,0,0,0.06), 0 0 0 1px var(--rule);
        }

        .report-content {

          font-size: 11.5px;
          line-height: 1.58;
          letter-spacing: -0.01em;

        }
